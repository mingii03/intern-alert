name: 인턴 공고 확인

on:
  schedule:
    # 3시간마다 확인 (한국시간 0시, 3시, 6시 … 21시 구간).
    # GitHub 예약은 늦거나 건너뛰는 일이 잦아 구간마다 예비 시각 2개를 더 걸어 둠.
    # 이미 확인한 구간이면 예비 실행은 main.py에서 바로 건너뜀.
    - cron: "7,47 */3 * * *"      # 정시+7분, 정시+47분
    - cron: "27 1-23/3 * * *"     # 정시+1시간 27분
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write             # seen.json(이미 보낸 공고 기록) 저장용

concurrency:
  group: intern-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 새 공고 확인 및 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      - name: 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen.json" && git pull --rebase && git push)
